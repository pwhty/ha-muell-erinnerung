name: Basic validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q custom_components/muell_erinnerung
      - run: python -m json.tool custom_components/muell_erinnerung/manifest.json >/dev/null
      - run: python -m json.tool HACS.json >/dev/null
